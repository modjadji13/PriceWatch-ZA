spring.application.name=PriceWatchZA

# Bind to the port the host provides in production (Render and Railway inject
# PORT); fall back to 8080 for local development.
server.port=${PORT:8080}

# The datasource is supplied by the environment in production. Set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
# on the host to point at the managed Postgres. The localhost values below are
# only a fallback for running locally without those variables set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pricewatchza}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
